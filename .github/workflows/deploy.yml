name: Deploy (Azure Container Apps)

# Manual promotion of an already-tested image tag (immutable SHA) to an environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: Git SHA of a green CI run on main
        required: true

permissions:
  id-token: write # OIDC federation: no long-lived Azure secrets in GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }} # protection rules / required reviewers live here
    strategy:
      max-parallel: 1
      matrix:
        app: [ai-service, fields-service, api-gateway, web] # dependency order
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out new revision
        run: |
          az containerapp update \
            --name "agrolens-${{ matrix.app }}-${{ inputs.environment }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ inputs.image_tag }}"
