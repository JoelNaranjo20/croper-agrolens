name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-services:
    name: Node services (lint, typecheck, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (in-memory)
        run: npm test
      # Integration: the fields-service suite also runs against a real MongoDB (2dsphere, $nearSphere).
      - name: Start MongoDB
        # Readiness = a real `ping` through the Node driver from the host. (A bare TCP probe is a
        # false positive: docker-proxy accepts connections before mongod listens; and mongosh
        # inside the container races with the image entrypoint's chown of /data/db.)
        run: |
          # Kernel >= 6.19 breaks MongoDB 8.x startup (SERVER-121912); let glibc own rseq.
          docker run -d --name mongo -p 27017:27017 -e GLIBC_TUNABLES=glibc.pthread.rseq=1 mongo:8.0
          for i in $(seq 1 45); do
            if node -e "require('mongodb').MongoClient.connect('mongodb://127.0.0.1:27017',{serverSelectionTimeoutMS:1500}).then(c=>c.db().command({ping:1}).then(()=>c.close())).then(()=>process.exit(0),()=>process.exit(1))"; then
              echo "MongoDB ready"; exit 0
            fi
            sleep 2
          done
          echo "::error title=MongoDB did not start::$(docker ps -a --filter name=mongo --format '{{.Status}}') $(docker logs mongo 2>&1 | tail -n 8 | tr '\n' ' ')"
          exit 1
      - name: Tests (real MongoDB)
        run: npm test -w services/fields-service
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
      - run: npm run build

  ai-service:
    name: AI service (ruff, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest --cov --cov-report=term-missing

  web:
    name: Web (test, production build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,html,scss}"
      - run: npm test
      - run: npm run build # fails if bundle budgets are exceeded

  images:
    name: Build & push images
    needs: [node-services, ai-service, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: fields-service, context: ., file: services/Dockerfile.node, service: fields-service }
          - { name: api-gateway, context: ., file: services/Dockerfile.node, service: api-gateway }
          - { name: ai-service, context: services/ai-service, file: services/ai-service/Dockerfile, service: '' }
          - { name: web, context: apps/web, file: apps/web/Dockerfile, service: '' }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
