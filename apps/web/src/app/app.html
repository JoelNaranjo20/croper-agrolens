<header class="topbar">
  <a routerLink="/" class="brand" aria-label="AgroLens, inicio">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
      <circle cx="16" cy="16" r="15" fill="#2f6b3b" />
      <path
        d="M16 25c0-7 3-12 9-14-1 7-4 12-9 14Zm0 0c0-5-2-9-7-11 0 6 3 10 7 11Z"
        fill="#cde8b5"
      />
    </svg>
    <span>AgroLens</span>
  </a>
  <div class="status" aria-live="polite">
    @if (queue.count() > 0) {
      <span class="pill warn">{{ queue.count() }} por enviar</span>
    }
    @if (!network.online()) {
      <span class="pill off">Sin conexión</span>
    }
  </div>
</header>

<main class="container">
  <router-outlet />
</main>
